<div class="filter-sidebar">
  <div class="filter-header">
    <div class="filter-title-group">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
      <h3 class="filter-title">Filters</h3>
      @if (activeFiltersCount > 0) {
        <span class="filter-count-badge">{{ activeFiltersCount }}</span>
      }
    </div>
    @if (activeFiltersCount > 0) {
      <button class="reset-link-btn" (click)="onReset()">Reset All</button>
    }
  </div>

  <!-- Resource Type Filter (Segmented buttons) -->
  <div class="filter-group">
    <label class="filter-group-label">Resource Type</label>
    <div class="type-pill-group">
      @for (opt of typeOptions; track opt.value) {
        <button
          type="button"
          class="type-pill-btn"
          [class.active]="filters.type === opt.value"
          (click)="onTypeSelect(opt.value)"
        >
          {{ opt.label }}
        </button>
      }
    </div>
  </div>

  <!-- Category Filter -->
  <div class="filter-group">
    <app-select
      label="Category & Sector"
      id="category-select"
      [options]="categoryOptions"
      [value]="filters.category"
      (selectionChange)="onCategorySelect($event)"
    ></app-select>
  </div>

  <!-- State Filter -->
  <div class="filter-group">
    <app-select
      label="State / Jurisdiction"
      id="state-select"
      [options]="stateOptions"
      [value]="filters.state"
      (selectionChange)="onStateSelect($event)"
    ></app-select>
  </div>

  <!-- Status Filter -->
  <div class="filter-group">
    <app-select
      label="Implementation Status"
      id="status-select"
      [options]="statusOptions"
      [value]="filters.status"
      (selectionChange)="onStatusSelect($event)"
    ></app-select>
  </div>
</div>
