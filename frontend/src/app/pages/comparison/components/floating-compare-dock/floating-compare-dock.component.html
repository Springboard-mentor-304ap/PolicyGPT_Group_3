@if (comparisonService.isVisible()) {
  <aside class="floating-dock-container" aria-label="Selected schemes comparison dock">
    <div class="dock-inner">
      <div class="dock-info">
        <div class="dock-count-badge">
          <span>{{ comparisonService.selectedCount() }}/{{ comparisonService.MAX_ITEMS }}</span>
        </div>
        <div class="dock-labels">
          <h4 class="dock-title">Ready to Compare</h4>
          <p class="dock-sub">Select up to {{ comparisonService.MAX_ITEMS }} schemes or policies</p>
        </div>
      </div>

      <!-- Item Chips -->
      <div class="dock-chips">
        @for (item of comparisonService.selectedItems(); track item.id) {
          <div class="dock-chip" [title]="item.title">
            <span class="chip-text">{{ item.title }}</span>
            <button
              class="chip-remove-btn"
              (click)="onRemoveItem(item.id, $event)"
              aria-label="Remove item"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        }
      </div>

      <!-- Actions -->
      <div class="dock-actions">
        <button class="clear-dock-btn" (click)="onClearAll()">Clear</button>
        <app-button
          variant="primary"
          size="sm"
          (btnClick)="onNavigateToCompare()"
        >
          Compare Now
        </app-button>
      </div>
    </div>
  </aside>
}
