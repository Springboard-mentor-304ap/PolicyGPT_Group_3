<div class="auth-page">
  <app-card variant="auth" [padding]="'lg'">
    <div class="auth-header">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your PolicyGPT account</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
        @if (verifyEmailLink() !== null) {
          <a
            routerLink="/verify-email"
            [queryParams]="{ email: verifyEmailLink() }"
            class="text-link"
          >
            Verify your email
          </a>
        }
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <app-input
        formControlName="email"
        type="email"
        label="Email Address"
        placeholder="you@example.com"
        id="login-email"
        name="email"
        icon="mail"
        [required]="true"
        [error]="email?.invalid && email?.touched ? (email?.errors?.['required'] ? 'Email is required' : email?.errors?.['maxlength'] ? 'Email is too long' : 'Please enter a valid email') : null"
      />

      <app-input
        formControlName="password"
        type="password"
        label="Password"
        placeholder="Enter your password"
        id="login-password"
        name="password"
        icon="lock"
        [required]="true"
        [error]="password?.invalid && password?.touched ? (password?.errors?.['required'] ? 'Password is required' : 'Password is too long') : null"
      />

      <div class="form-row">
        <span></span>
        <a routerLink="/forgot-password" class="text-link text-sm">Forgot password?</a>
      </div>

      <app-button
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [loading]="loading()"
        [disabled]="loading()"
      >
        Sign In
      </app-button>
    </form>

    <div class="auth-footer">
      <p class="text-sm text-muted">
        Don't have an account?
        <a routerLink="/register" class="text-link">Create account</a>
      </p>
    </div>
  </app-card>
</div>
