<div class="auth-page">
  <app-card variant="auth" [padding]="'lg'">
    <div class="auth-header">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">
        No worries! Enter your email address and we'll send you a reset link.
      </p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <div class="success-content">
          <span>{{ successMessage() }}</span>
          <button type="button" class="text-link text-sm" (click)="goToResetPassword()">
            Proceed to Reset Password →
          </button>
        </div>
      </div>
    }

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <app-input
        formControlName="email"
        type="email"
        label="Email Address"
        placeholder="you@example.com"
        id="forgot-email"
        name="email"
        icon="mail"
        [required]="true"
        [error]="email?.invalid && email?.touched ? (email?.errors?.['required'] ? 'Email is required' : 'Please enter a valid email') : null"
      />

      <app-button
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [loading]="loading()"
        [disabled]="loading()"
      >
        Send Reset Link
      </app-button>
    </form>

    <div class="auth-footer">
      <p class="text-sm text-muted">
        Remember your password?
        <a routerLink="/login" class="text-link">Back to Sign In</a>
      </p>
    </div>
  </app-card>
</div>
