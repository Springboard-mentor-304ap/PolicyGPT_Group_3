<div class="auth-page">
  <app-card variant="auth" [padding]="'lg'">
    <div class="auth-header">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
        </svg>
      </div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Create a new strong password for your account.</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <div class="success-content">
          <span>{{ successMessage() }}</span>
          <button type="button" class="text-link text-sm" (click)="goToLogin()">
            Go to Sign In →
          </button>
        </div>
      </div>
    }

    @if (!successMessage()) {
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
        <app-input
          formControlName="newPassword"
          type="password"
          label="New Password"
          placeholder="Enter new password"
          id="reset-new-password"
          name="newPassword"
          icon="lock"
          [required]="true"
          [error]="newPassword?.invalid && newPassword?.touched ? 'Password must be at least 8 characters' : null"
        />

        <app-password-meter [password]="resetForm.get('newPassword')?.value || ''" />

        <app-compliance-audit [password]="resetForm.get('newPassword')?.value || ''" />

        <app-input
          formControlName="confirmPassword"
          type="password"
          label="Confirm Password"
          placeholder="Re-enter new password"
          id="reset-confirm-password"
          name="confirmPassword"
          icon="lock"
          [required]="true"
          [error]="confirmPassword?.invalid && confirmPassword?.touched ? (confirmPassword?.errors?.['passwordMismatch'] ? 'Passwords do not match' : 'Please confirm your password') : null"
        />

        <app-button
          type="submit"
          variant="primary"
          [fullWidth]="true"
          [loading]="loading()"
          [disabled]="loading()"
        >
          Reset Password
        </app-button>
      </form>
    }

    <div class="auth-footer">
      <p class="text-sm text-muted">
        <a routerLink="/login" class="text-link">← Back to Sign In</a>
      </p>
    </div>
  </app-card>
</div>
