<div class="auth-page">
  <app-card variant="auth" [padding]="'lg'">
    <div class="auth-header">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join PolicyGPT to access government policies</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <app-input
        formControlName="full_name"
        type="text"
        label="Full Name"
        placeholder="Enter your full name"
        id="register-name"
        name="full_name"
        icon="user"
        [required]="true"
        [error]="full_name?.invalid && full_name?.touched ? 'Full name is required' : null"
      />

      <app-input
        formControlName="email"
        type="email"
        label="Email Address"
        placeholder="you@example.com"
        id="register-email"
        name="email"
        icon="mail"
        [required]="true"
        [error]="email?.invalid && email?.touched ? (email?.errors?.['required'] ? 'Email is required' : 'Please enter a valid email') : null"
      />

      <app-input
        formControlName="password"
        type="password"
        label="Password"
        placeholder="Create a strong password"
        id="register-password"
        name="password"
        icon="lock"
        [required]="true"
        [error]="password?.invalid && password?.touched ? 'Password must be at least 8 characters' : null"
      />

      <app-password-meter [password]="registerForm.get('password')?.value || ''" />

      <app-compliance-audit [password]="registerForm.get('password')?.value || ''" />

      <app-input
        formControlName="confirmPassword"
        type="password"
        label="Confirm Password"
        placeholder="Re-enter your password"
        id="register-confirm-password"
        name="confirmPassword"
        icon="lock"
        [required]="true"
        [error]="confirmPassword?.invalid && confirmPassword?.touched ? (confirmPassword?.errors?.['passwordMismatch'] ? 'Passwords do not match' : 'Please confirm your password') : null"
      />

      <label class="checkbox-label">
        <input type="checkbox" formControlName="agreeTerms" class="checkbox-input" />
        <span class="checkbox-text">
          I agree to the
          <a href="javascript:void(0)" class="text-link">Terms of Service</a>
          and
          <a href="javascript:void(0)" class="text-link">Privacy Policy</a>
        </span>
      </label>
      @if (agreeTerms?.invalid && agreeTerms?.touched) {
        <p class="error-text">You must agree to the terms</p>
      }

      <app-button
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [loading]="loading()"
        [disabled]="loading()"
      >
        Create Account
      </app-button>
    </form>

    <div class="auth-footer">
      <p class="text-sm text-muted">
        Already have an account?
        <a routerLink="/login" class="text-link">Sign in</a>
      </p>
    </div>
  </app-card>
</div>
