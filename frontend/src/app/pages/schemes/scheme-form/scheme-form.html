<div class="scheme-form-container">
  <h1>Create Scheme</h1>

  <form [formGroup]="schemeForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="policy_id">Policy ID</label>
      <input
        id="policy_id"
        type="text"
        formControlName="policy_id"
        placeholder="Enter Policy ID"
      />
    </div>

    <div class="form-group">
      <label for="title">Scheme Title *</label>
      <input
        id="title"
        type="text"
        formControlName="title"
        placeholder="Enter scheme title"
      />
      <small
        class="error"
        *ngIf="schemeForm.get('title')?.touched && schemeForm.get('title')?.invalid"
      >
        Scheme title is required.
      </small>
    </div>

    <div class="form-group">
      <label for="description">Description *</label>
      <textarea
        id="description"
        rows="4"
        formControlName="description"
        placeholder="Enter scheme description"
      ></textarea>
      <small
        class="error"
        *ngIf="schemeForm.get('description')?.touched && schemeForm.get('description')?.invalid"
      >
        Description is required.
      </small>
    </div>

    <div class="form-group">
      <label for="category">Category *</label>
      <select id="category" formControlName="category">
        <option value="">Select Category</option>

        <option *ngFor="let category of categories" [value]="category">
          {{ category }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="benefits">Benefits *</label>
      <textarea
        id="benefits"
        rows="4"
        formControlName="benefits"
        placeholder="Enter scheme benefits"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="application_process">Application Process *</label>
      <textarea
        id="application_process"
        rows="4"
        formControlName="application_process"
        placeholder="Enter application process"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="department">Department *</label>
      <input
        id="department"
        type="text"
        formControlName="department"
        placeholder="Enter department"
      />
    </div>

    <div class="form-group">
      <label for="state">State *</label>
      <input
        id="state"
        type="text"
        formControlName="state"
        placeholder="Enter state"
      />
    </div>

    <div class="form-group">
      <label for="status">Status *</label>
      <select id="status" formControlName="status">
        <option *ngFor="let status of statuses" [value]="status">
          {{ status }}
        </option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="launch_date">Launch Date</label>
        <input
          id="launch_date"
          type="date"
          formControlName="launch_date"
        />
      </div>

      <div class="form-group">
        <label for="deadline_date">Deadline Date</label>
        <input
          id="deadline_date"
          type="date"
          formControlName="deadline_date"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="document_url">Document URL</label>
      <input
        id="document_url"
        type="url"
        formControlName="document_url"
        placeholder="Enter document URL"
      />
    </div>

    <button type="submit">
      Create Scheme
    </button>

  </form>
</div>
