<div class="scheme-list-container">
  <div class="header">
    <div>
      <h1>Scheme Management</h1>
      <p>View all government schemes</p>
    </div>

    <button type="button" class="create-btn">
      + Create Scheme
    </button>
  </div>

  <div class="scheme-table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Department</th>
          <th>State</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let scheme of schemes">
          <td>{{ scheme.title }}</td>
          <td>{{ scheme.category }}</td>
          <td>{{ scheme.department }}</td>
          <td>{{ scheme.state }}</td>
          <td>
            <span
              class="status"
              [ngClass]="scheme.status"
            >
              {{ scheme.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
