<app-modal
  [isOpen]="true"
  [title]="'Eligibility Assessment'"
  [subtitle]="scheme.title"
  size="drawer"
  (close)="onClose()"
>
  <!-- Loading State -->
  @if (evaluating()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Checking your eligibility for <strong>{{ scheme.title }}</strong>...</p>
    </div>
  }

  <!-- Error State -->
  @if (error() && !evaluating()) {
    <div class="error-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="48" height="48">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <p>{{ error() }}</p>
      <app-button variant="secondary" (btnClick)="checkEligibility()">Retry</app-button>
    </div>
  }

  <!-- Result -->
  @if (result() && !evaluating()) {
    <div class="result-wrapper">
      <app-eligibility-result
        [result]="result()!"
        (modifyProfile)="onModifyProfile()"
      ></app-eligibility-result>
    </div>
  }
</app-modal>
