<div class="select-group" [class.has-error]="!!error" [class.is-disabled]="disabled">
  @if (label) {
    <label [for]="id" class="select-label">
      {{ label }}
      @if (required) {
        <span class="required-asterisk">*</span>
      }
    </label>
  }

  <div class="select-wrapper" [attr.data-size]="size">
    <select
      #selectEl
      [id]="id"
      [name]="name"
      [disabled]="disabled"
      [value]="value"
      (change)="handleChange($event)"
      (blur)="handleBlur()"
      class="select-control"
    >
      @if (placeholder) {
        <option value="" [disabled]="required">{{ placeholder }}</option>
      }
      @for (opt of options; track opt.value) {
        <option [value]="opt.value" [disabled]="opt.disabled">{{ opt.label }}</option>
      }
    </select>
    <div class="select-arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>

  @if (error) {
    <p class="select-error" role="alert">{{ error }}</p>
  } @else if (hint) {
    <p class="select-hint">{{ hint }}</p>
  }
</div>
