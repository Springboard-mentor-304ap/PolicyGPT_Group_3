<div class="compliance-box">
  <h4 class="compliance-title">COMPLIANCE AUDIT:</h4>
  <ul class="compliance-list">
    @for (rule of rules; track rule.id) {
      <li class="compliance-item" [class.passed]="rule.passed" [class.failed]="!rule.passed && !!password">
        <span class="compliance-icon" aria-hidden="true">
          @if (rule.passed) {
            <!-- Checkmark SVG -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          } @else {
            <!-- Bullet / Missing Cross SVG -->
            @if (password) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
            } @else {
              <span class="neutral-bullet"></span>
            }
          }
        </span>
        <span class="compliance-label">{{ rule.label }}</span>
      </li>
    }
  </ul>
</div>
