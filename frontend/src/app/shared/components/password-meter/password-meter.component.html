@if (password) {
  <div class="password-meter-container">
    <div class="meter-bars" [ngClass]="levelClass">
      <div class="meter-segment" [class.active]="score >= 1"></div>
      <div class="meter-segment" [class.active]="score >= 2"></div>
      <div class="meter-segment" [class.active]="score >= 3"></div>
      <div class="meter-segment" [class.active]="score >= 4"></div>
    </div>
    <div class="meter-label">
      <span>Password Strength:</span>
      <strong [ngClass]="levelClass">{{ label }}</strong>
    </div>
  </div>
}
